name: IFIA CI & Security Verification

on:
  push:
    branches: [ main, master, 'ifia/**', 'release/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Build, Test & Security Verification (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    env:
      AUTH_SECRET: 'ci-testing-256-bit-cryptographic-security-token-key-2026'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build Server
        run: npm run build:server

      - name: Build Client Dashboard
        run: npm run build:client

      - name: Run Test Suite (Security, QA, Contracts, CMMS)
        run: npm test

      - name: Run Empirical Reliability Benchmark Harness
        run: npm run benchmark

