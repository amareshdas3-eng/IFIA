name: IFIA CI & Security Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Build, Test & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build Server
        run: npm run build:server

      - name: Build Client Dashboard
        run: npm run build:client

      - name: Run Test Suite (Security, QA, Contracts, CMMS)
        run: npm test

      - name: Run Empirical Reliability Benchmark Harness
        run: npm run benchmark
